<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYP FIN</title>
<meta name="theme-color" content="#0B5FA5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  /* phone first: one column, big targets, system font so it opens without internet */
  --blue:#0B5FA5; --logo:#0091D5; --ink:#14213D; --muted:#4A5568; --ground:#F4F6FA; --card:#FFFFFF; --line:#D5DBE6; --edge:#7A869A;
  --em-bg:#FFE9D1; --em-ink:#6B2C00; --em:#B85300; --ok-bg:#DDF2DA; --ok-ink:#14600A; --wait-bg:#E4EBF7; --wait-ink:#1D3F7A;
  --warn-bg:#FFF4C2; --warn-ink:#5C4400; --bad:#8A160C; --off-bg:#ECECEC; --off-ink:#333333; --demo:#EF7D00;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
h1{margin:0;font-size:22px} h2{margin:8px 0 0;font-size:18px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ground)}
.demo{background:var(--demo);color:#1A1A1A;font-weight:700;font-size:14px;padding:8px 16px}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.top .who{font-size:14px;font-weight:700;color:var(--muted);text-align:right}
.net{font-size:13px;font-weight:700;padding:6px 16px;background:var(--warn-bg);color:var(--warn-ink)}
.net.bad{background:#FBE3E0;color:var(--bad)}
main{flex:1 1 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.tap{cursor:pointer}
.band{background:var(--em-bg);color:var(--em-ink);margin:-14px -14px 0;padding:10px 14px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.b{font-weight:700} .s{font-size:14px} .m{color:var(--muted)} .num{font-variant-numeric:tabular-nums}.row>.num{white-space:nowrap}
.big{font-size:20px;font-weight:700}
.sec{font-size:14px;font-weight:700;color:var(--blue)}
.pill{padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--wait-bg);color:var(--wait-ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.em{background:var(--em-bg);color:var(--em-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.off{background:var(--off-bg);color:var(--off-ink)}
.tag{padding:2px 8px;border-radius:6px;font-size:14px;font-weight:700;background:var(--ink);color:#fff}
.btn{min-height:48px;padding:0 14px;border-radius:8px;border:2px solid var(--edge);background:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.em{background:var(--em);border-color:var(--em);color:#fff}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{min-height:56px;font-size:18px}
.btn.full{width:100%}
.btns{display:flex;gap:8px}.btns>*{flex:1 1 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-weight:700}
.in{width:100%;min-height:48px;padding:0 12px;border:2px solid var(--edge);border-radius:8px;background:#fff}
textarea.in{padding:10px 12px;min-height:80px}
input[type=file].in{padding:10px;border-style:dashed;font-size:14px}
.box{border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box.info{background:var(--wait-bg);border:2px solid var(--blue);color:var(--wait-ink);font-weight:700}
.box.em{background:var(--em-bg);border:2px solid var(--em);color:var(--em-ink)}
.box.warn{background:var(--warn-bg);border:2px solid #8A6A00;color:var(--warn-ink);font-weight:700}
.box.ok{background:var(--ok-bg);border:2px solid var(--ok-ink);color:var(--ok-ink);font-weight:700}
.box.err{background:#fff;border:2px solid #A61B0F;color:var(--bad);font-weight:700}
.box.plain{background:#fff;border:1px solid var(--line)}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar>i{display:block;background:var(--blue)} .bar>i.add{background:#7FA3DC} .bar>i.em{background:var(--demo)}
.bad{color:var(--bad);font-weight:700} .good{color:var(--ok-ink);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;pointer-events:none}
nav>div{pointer-events:auto;width:100%;max-width:560px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 1 0;min-height:62px;padding:4px 2px;border:0;border-top:4px solid #fff;background:#fff;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--blue);border-top-color:var(--blue)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.modal{position:fixed;inset:0;z-index:10;background:rgba(20,33,61,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--ground);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column;gap:10px}
.user{min-height:60px;justify-content:space-between;text-align:left;width:100%}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:400}
.checks input{width:22px;height:22px}
img.photo{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.center{align-items:center;text-align:center}
@media (min-width:700px){body{background:#E7EBF3}#app{box-shadow:0 0 0 1px var(--line)}.modal{align-items:center}.sheet{border-radius:16px}}
@media (prefers-reduced-motion:no-preference){.btn,nav button{transition:background .12s,color .12s}}
</style>
</head>
<body>
<div id="app"></div>
<script src="budget.js"></script>
<script src="core.js"></script>
<script>
'use strict';
var FIN_VERSION = 'alpha 0.2';

/* ================= small tools ================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function clone(o) { return o == null ? o : JSON.parse(JSON.stringify(o)); }
function uid() { var a = new Uint8Array(12); (window.crypto || window.msCrypto).getRandomValues(a); var s = ''; for (var i = 0; i < a.length; i++) s += ('0' + a[i].toString(16)).slice(-2); return s; }
function nowIso() { return new Date().toISOString(); }
function today() { return finToday(nowIso()); }
function money(n) { return 'K ' + (Math.round(Number(n) * 100) / 100).toLocaleString('en-US'); }
function pct(n, d) { return d > 0 ? Math.round(n / d * 100) : 0; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], MOL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function day(s) { if (!finIsDate(s)) return ''; return WD[finWeekday(s)] + ' ' + Number(s.slice(8, 10)) + ' ' + MO[Number(s.slice(5, 7)) - 1] + (s.slice(0, 4) !== today().slice(0, 4) ? ' ' + s.slice(0, 4) : ''); }
function when(iso) { return iso ? day(finToday(iso)) : ''; }
/* SHA-256 of a plain text (letters and digits only), as hex */
function sha256(ascii) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mp = Math.pow, maxWord = mp(2, 32), i, j, result = '', words = [], bits = ascii.length * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], pc = k.length, comp = {};
  for (var c = 2; pc < 64; c++) { if (!comp[c]) { for (i = 0; i < 313; i += c) comp[i] = c; hash[pc] = (mp(c, .5) * maxWord) | 0; k[pc++] = (mp(c, 1 / 3) * maxWord) | 0; } }
  ascii += '\x80'; while (ascii.length % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); if (j >> 8) return ''; words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = ((bits / maxWord) | 0); words[words.length] = bits;
  for (j = 0; j < words.length;) {
    var w = words.slice(j, j += 16), old = hash; hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));

    }

  }
  for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; result += ((b < 16) ? '0' : '') + b.toString(16); }
  return result;
}
function credOf(salt, pin) { return sha256(salt + ':' + pin); }
var IC = {
  soon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  'new': '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  mine: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  decide: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12l3 3 5-6"/>',
  dead: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  month: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
  pay: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
  rec: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
  more: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  people: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 15c3 0 5 2 5 5"/>',
  rules: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h.01"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  out: '<path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/>',
  down: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  send: '<path d="M4 12l16-8-6 16-3-7z"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'
};
function ic(n) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (IC[n] || '') + '</svg>'; }
var LOGO = '<svg role="img" aria-label="CYP FIN" viewBox="0 0 897 200" style="width:126px;height:28px;display:block;flex-shrink:0"><defs><pattern id="chit" patternUnits="userSpaceOnUse" width="48" height="72"><rect width="48" height="72" fill="#198A00"/><polygon points="0,-18 24,-38 48,-18 48,0 24,-20 0,0" fill="#EF7D00" stroke="#fff" stroke-width="2.5"/><polygon points="0,0 24,-20 48,0 48,18 24,-2 0,18" fill="#198A00" stroke="#fff" stroke-width="2.5"/><polygon points="0,18 24,-2 48,18 48,36 24,16 0,36" fill="#DE2010" stroke="#fff" stroke-width="2.5"/><polygon points="0,36 24,16 48,36 48,54 24,34 0,54" fill="#111" stroke="#fff" stroke-width="2.5"/><polygon points="0,54 24,34 48,54 48,72 24,52 0,72" fill="#EF7D00" stroke="#fff" stroke-width="2.5"/><polygon points="0,72 24,52 48,72 48,90 24,70 0,90" fill="#198A00" stroke="#fff" stroke-width="2.5"/></pattern><clipPath id="cap"><rect width="897" height="200"/></clipPath></defs><g clip-path="url(#cap)" fill="none" stroke-width="46"><g stroke="#0091D5"><path d="M127,52 C110,30 95,23 80,23 C45,23 23,55 23,100 C23,145 45,177 80,177 C95,177 110,170 127,148"/><path d="M155,-10 L228,105 L301,-10"/><path d="M228,105 L228,200"/><path d="M345,200 L345,23 L397,23 C427,23 444,40 444,66 C444,92 427,109 397,109 L345,109"/></g><g stroke="url(#chit)"><path d="M621,23 L534,23 L534,200"/><path d="M534,100 L606,100"/><path d="M676,0 L676,200"/><path d="M754,200 L754,0 L874,200 L874,0"/></g></g></svg>';

/* ================= budget ================= */
var SEC = {}, LINE = {};
FIN_BUDGET.sections.forEach(function (s) {
  var tot = 0;
  s.lines = s.lines.map(function (l) { var o = { id: l[0], name: l[1], qty: l[2], unit: l[3], freq: l[4], total: l[5], act: l[6] || '', sec: s.code }; LINE[o.id] = o; tot += o.total; return o; });
  s.total = tot; SEC[s.code] = s;
});
function secName(code) { return SEC[code] ? SEC[code].name : code; }

/* ================= what is kept on this phone ================= */
var KV = (function () {
  var mem = {}, dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(function (res) {
      try {
        var rq = indexedDB.open('cyp-fin', 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore('kv'); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
    return dbp;
  }
  return {
    get: function (k) { return open().then(function (db) { if (!db) return mem[k]; return new Promise(function (res) { try { var r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = function () { res(r.result); }; r.onerror = function () { res(mem[k]); }; } catch (e) { res(mem[k]); } }); }); },
    set: function (k, v) { mem[k] = v; return open().then(function (db) { if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); } catch (e) {} }); }
  };
})();

var S = { cfg: null, users: [], me: null, cred: '', cache: null, queue: [], verif: {}, online: true, syncing: false, lastSync: '', notices: [], local: null, files: {},
  ui: { screen: 'boot', tab: '', form: {}, modal: null, m: {}, month: '', pick: null, err: '', msg: '' }, _v: null };
function emptyCache() { return { users: [], requests: [], deadlines: [], settings: null, since: 0 }; }
function saveQueue() { KV.set('queue', S.queue); }
function saveCache() { if (S.me) KV.set('cache:' + S.me.id, S.cache); }
function myQueue() { return S.queue.filter(function (o) { return S.me && o.user === S.me.id; }); }

/* the database on this phone only (demo, or a first test without Google) */
var localStore = {
  key: function () { return 'local'; }, now: nowIso,
  load: function () { return S.local; },
  save: function (db) { S.local = db; KV.set('localdb', db); },
  saveFile: function (name, mime, b64) { var id = 'L' + uid(); S.files[id] = { mime: mime, b64: b64 }; KV.set('localfiles', S.files); return id; },
  getFile: function (id) { return S.files[id] || null; }
};
function call(req) {
  req.key = S.cfg.key;
  if (S.cfg.mode !== 'shared') { try { return Promise.resolve(clone(finHandle(req, localStore))); } catch (e) { return Promise.reject(e); } }
  return fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow' }).then(function (r) { return r.json(); });
}

/* ================= the picture on screen = what the database said + what is still waiting to be sent ================= */
function V() {
  if (S._v) return S._v;
  var c = S.cache || emptyCache();
  var db = { v: 1, rev: 0, seq: 0, users: clone(c.users), requests: clone(c.requests), deadlines: clone(c.deadlines), settings: clone(c.settings) || finNewDb().settings, opIds: [] };
  var me = finFind(db.users, S.me.id) || clone(S.me), pend = {}, isNew = {};
  myQueue().forEach(function (op) {
    if (op.t === 'req_new') isNew[op.d.id] = 1;
    try { finApply(db, me, op, op.at || nowIso(), null, null); } catch (e) {}
    if (op.d && op.d.id) pend[op.d.id] = 1;
  });
  db.requests.forEach(function (r) { if (pend[r.id]) r.pending = true; if (isNew[r.id]) r.no = ''; });
  db.me = me; S._v = db; return db;
}
function fresh() { S._v = null; }
var ERR = { section: 'You cannot do this for that section.', what: 'Write what you need.', amount: 'Write the amount.', line: 'Choose the budget line.', prio: 'Choose the priority.', date: 'Choose the date.',
  reason: 'Say why it is an Emergency.', role: 'Your role cannot do this.', status: 'This request has changed in the meantime. Look at it again.', fields: 'Something is missing.', id: 'Not found.',
  pin: 'A PIN is needed.', last_admin: 'At least one administrator must stay.', photo: 'The photo could not be read.', server: 'The database had a problem. Try again.' };
function errText(e) { return ERR[e] || ('Not accepted (' + e + ').'); }
/* do one change: check it here first, show it at once, send it when there is internet */
function act(t, d) {
  var op = { id: uid(), t: t, d: d, at: nowIso(), user: S.me.id };
  var v = clone(V()); delete v.me;
  var res = finApply(v, finFind(v.users, S.me.id) || clone(S.me), op, op.at, null, null);
  if (!res.ok) return res;
  S.queue.push(op); saveQueue(); fresh(); sync();
  return res;
}

function mergeList(list, items) { items.forEach(function (x) { var i = -1; for (var k = 0; k < list.length; k++) if (list[k].id === x.id) { i = k; break; } if (i < 0) list.push(x); else list[i] = x; }); }
function sync() {
  if (S.syncing || !S.me || !S.cfg) return Promise.resolve();
  S.syncing = true;
  var ops = myQueue().slice(0, 8), before = S.cache.since + ':' + S.queue.length + ':' + S.online;
  return call({ action: 'sync', user: S.me.id, cred: S.cred, since: S.cache.since, ops: ops }).then(function (res) {
    S.online = true;
    if (!res.ok) {
      if (res.error === 'pin' || res.error === 'user') { signOut(res.error === 'user' ? 'This person is switched off. Ask the administrator.' : 'The PIN has changed. Sign in again.'); return; }
      if (res.error === 'key') { S.ui.msg = 'This link is no longer valid. Ask the administrator for the new link.'; }
      return;
    }
    var done = {};
    (res.results || []).forEach(function (r) { done[r.id] = r; });
    ops.forEach(function (op) {
      var r = done[op.id]; if (!r) return;
      if (!r.ok) S.notices.push(errText(r.error));
      else if (op.t === 'pin') { S.cred = op.d.cred; remember(); }
    });
    S.queue = S.queue.filter(function (o) { return !done[o.id]; }); saveQueue();
    if (res.full) { S.cache.users = res.users; S.cache.requests = res.requests; S.cache.deadlines = res.deadlines; }
    else { mergeList(S.cache.users, res.users); mergeList(S.cache.requests, res.requests); mergeList(S.cache.deadlines, res.deadlines); }
    if (res.settings) S.cache.settings = res.settings;
    S.cache.since = res.rev; S.lastSync = res.now || nowIso();
    if (res.me) { S.me = res.me; }
    S.users = S.cache.users.slice(); KV.set('users', S.users);
    saveCache(); fresh();
  }).catch(function () { S.online = false; }).then(function () {
    S.syncing = false;
    var after = S.cache ? S.cache.since + ':' + S.queue.length + ':' + S.online : '';
    if (after !== before || S.notices.length) render();
    if (S.me && S.online && myQueue().length) setTimeout(sync, 400);
  });
}
function remember() {
  if (!S.me) return;
  S.verif[S.me.id] = sha256('v:' + S.cred); KV.set('verif', S.verif);
  try { sessionStorage.setItem('fin-session', JSON.stringify({ id: S.me.id, cred: S.cred })); } catch (e) {}
}
function signOut(msg) {
  S.me = null; S.cred = ''; S.cache = null; fresh();
  try { sessionStorage.removeItem('fin-session'); } catch (e) {}
  S.ui = { screen: 'login', tab: '', form: {}, modal: null, m: {}, month: '', pick: null, err: '', msg: msg || '' };
  render();

/* ================= numbers used on several screens ================= */

/* ================= photos: made small before they are kept ================= */
function readPhoto(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var max = 1280, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var data = c.toDataURL('image/jpeg', 0.7); res({ mime: 'image/jpeg', b64: data.slice(data.indexOf(',') + 1) });
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('photo')); };
    img.src = url;
  });
}

    }).catch(function () { S.ui.err = 'No internet. Try again.'; render(); });
  },
  pickUser: function (el) { S.ui.pick = finFind(S.users, el.dataset.id); S.ui.form = {}; S.ui.err = ''; S.ui.msg = ''; S.ui.keepScroll = false; render(); var p = document.getElementById('lg-pin'); if (p) p.focus(); },
  back: function () { S.ui.pick = null; S.ui.err = ''; render(); },
  login: function () {
    var u = S.ui.pick, pin = S.ui.form.pin, cred = credOf(u.salt, pin || '');
    if (!pinOk(pin)) { S.ui.err = 'Write your PIN.'; return render(); }
    call({ action: 'login', user: u.id, cred: cred }).then(function (res) {
      S.online = true;
      if (res.ok) return enter(res.me, cred);
      S.ui.err = res.error === 'locked' ? 'Too many wrong PINs. Wait one minute.' : res.error === 'pin' ? 'Wrong PIN.' : res.error === 'user' ? 'This person cannot enter. Ask the administrator.' : errText(res.error);
      S.ui.form.pin = ''; render();
    }).catch(function () {
      S.online = false;
      if (S.verif[u.id] && S.verif[u.id] === sha256('v:' + cred)) return enter(u, cred);
      S.ui.err = S.verif[u.id] ? 'Wrong PIN.' : 'No internet. The first time on this phone you need internet.'; S.ui.form.pin = ''; render();
    });
  },
  signOutAsk: function () { var q = myQueue().length; openModal({ type: 'ask', title: 'Sign out?', text: q ? q + ' changes are not sent yet. They stay on this phone and go when you sign in again with internet.' : 'You will need your PIN to enter again.', yes: 'signOut', yesText: 'Sign out' }); },
  signOut: function () { signOut(''); },
  setPrio: function (el) { S.ui.form.prio = el.dataset.id; S.ui.err = ''; render(); },
  setPay: function (el) { S.ui.form.pay = el.dataset.id; render(); },
  askNow: function (el) {
    var x = finFind(V().deadlines, el.dataset.id); if (!x) return;
    S.ui.form = { section: x.section, what: x.what, amount: String(x.amount), line: x.line || '', needed: x.date, pay: x.pay || 'bank', deadline: x.id };
    go('new');
  },
  send: function () {
    var f = S.ui.form, miss = [], amount = Number(f.amount), short = isShort();
    if (!f.section) miss.push('the section'); if (!String(f.what || '').trim()) miss.push('what you need'); if (!(amount > 0)) miss.push('the amount');
    if (!f.line) miss.push('the budget line'); if (!f.prio) miss.push('the priority'); if (!finIsDate(f.needed)) miss.push('the date');
    if (short && !f.reason) miss.push('why it is an Emergency'); if (short && !String(f.why || '').trim()) miss.push('a few words to explain');
    if (miss.length) { S.ui.err = 'Still missing: ' + miss.join(', ') + '.'; return render(); }
    var res = act('req_new', { id: uid(), section: f.section, what: f.what, amount: amount, line: f.line, lineName: f.line === 'none' ? 'Not in the budget' : (LINE[f.line] ? LINE[f.line].name : ''), prio: f.prio, needed: f.needed, pay: f.pay, reason: f.reason || '', why: f.why || '', deadline: f.deadline || '', photo: f.photo || null, created: today() });
    if (!res.ok) { S.ui.err = errText(res.error); return render(); }
    S.ui.form = {};
    go('mine'); S.ui.msg = 'Sent to the Director.'; render();
  },
  openReq: function (el) { openModal({ type: 'req', id: el.dataset.id }); },
  closeModal: function () { S.ui.modal = null; S.ui.merr = ''; render(); },
  modalBg: function (el, ev) { if (ev.target === el) H.closeModal(); },
  cancelReq: function (el) { var r = act('req_cancel', { id: el.dataset.id }); if (!r.ok) { S.ui.merr = errText(r.error); } render(); },
  seeFile: function (el) {
    var x = S.ui.modal, id = el.dataset.id; x.img = ''; x.wait = 'Opening the photo...'; render();
    if (id === 'pending') { x.wait = 'The photo is still on the phone of who added it. It arrives when that phone has internet.'; return render(); }
    call({ action: 'file_get', user: S.me.id, cred: S.cred, id: id }).then(function (res) { x.wait = ''; if (res.ok) x.img = 'data:' + res.mime + ';base64,' + res.b64; else x.wait = 'The photo was not found.'; render(); }).catch(function () { x.wait = 'No internet: the photo cannot be opened now.'; render(); });
  },
  receipt: function (el) { var r = act('receipt', { id: el.dataset.id, photo: S.ui.m.photo || null }); if (!r.ok) S.ui.merr = errText(r.error); else S.ui.modal = null; render(); },
  approve: function (el) { var r = act('decide', { id: el.dataset.id, status: 'Approved', note: '' }); if (!r.ok) S.notices.push(errText(r.error)); render(); },
  later: function (el) { openModal({ type: 'note', id: el.dataset.id, status: 'Next week' }); },
  refuse: function (el) { openModal({ type: 'note', id: el.dataset.id, status: 'Not approved' }); },
  decideSave: function () { var x = S.ui.modal, r = act('decide', { id: x.id, status: x.status, note: S.ui.m.note || '' }); if (!r.ok) { S.ui.merr = errText(r.error); } else S.ui.modal = null; render(); },
  undo: function (el) { var r = act('decide', { id: el.dataset.id, status: 'Waiting', note: '' }); if (!r.ok) S.notices.push(errText(r.error)); render(); },
  paid: function (el) { var r = act('pay', { id: el.dataset.id }); if (!r.ok) S.notices.push(errText(r.error)); render(); },
  unpay: function (el) { var r = act('unpay', { id: el.dataset.id }); if (!r.ok) S.notices.push(errText(r.error)); render(); },
  weekSave: function () {
    var a = Number(S.ui.form.week);
    if (S.ui.form.week == null || S.ui.form.week === '' || !(a >= 0)) { S.notices.push('Write the money for this week.'); return render(); }
    var r = act('week_money', { week: today(), amount: a }); if (!r.ok) S.notices.push(errText(r.error)); delete S.ui.form.week; render();
  },
  dlNew: function () { openModal({ type: 'dl', id: '' }, { section: S.me.sections.length === 1 ? S.me.sections[0] : '' }); },
  dlEdit: function (el) { var x = finFind(V().deadlines, el.dataset.id); if (!x) return; openModal({ type: 'dl', id: x.id }, { section: x.section, what: x.what, amount: x.amount, line: x.line, date: x.date, monthly: x.repeat === 'monthly', cash: x.pay === 'cash' }); },
  dlSave: function () {
    var m = S.ui.m, x = S.ui.modal, miss = [];
    if (!m.section) miss.push('the section'); if (!String(m.what || '').trim()) miss.push('what it is'); if (!(Number(m.amount) > 0)) miss.push('the amount'); if (!finIsDate(m.date)) miss.push('the date');
    if (miss.length) { S.ui.merr = 'Still missing: ' + miss.join(', ') + '.'; return render(); }
    var r = act('dl_save', { id: x.id || uid(), section: m.section, what: m.what, amount: Number(m.amount), line: m.line || '', lineName: LINE[m.line] ? LINE[m.line].name : '', date: m.date, repeat: m.monthly ? 'monthly' : '', pay: m.cash ? 'cash' : 'bank' });
    if (!r.ok) S.ui.merr = errText(r.error); else S.ui.modal = null; render();
  },
  dlDel: function (el) { var r = act('dl_del', { id: el.dataset.id }); if (!r.ok) S.ui.merr = errText(r.error); else S.ui.modal = null; render(); },
  allReqs: function () { S.ui.form = {}; go('all'); },
  people: function () { go('people'); },
  personNew: function () { openModal({ type: 'person', id: '' }, { role: 'head', sections: [], active: true }); },
  personEdit: function (el) { var u = finFind(V().users, el.dataset.id); if (!u) return; openModal({ type: 'person', id: u.id }, { name: u.name, role: u.role, sections: (u.sections || []).slice(), admin: u.admin, active: u.active !== false, pin: '' }); },
  personSave: function () {
    var m = S.ui.m, x = S.ui.modal, d = { id: x.id || uid(), name: m.name, role: m.role || 'head', sections: m.sections || [], admin: !!m.admin, active: m.active !== false };
    if (!String(m.name || '').trim()) { S.ui.merr = 'Write the name.'; return render(); }
    if (!x.id && !pinOk(m.pin)) { S.ui.merr = 'The PIN must be 4 to 8 numbers.'; return render(); }
    if (m.pin && !pinOk(m.pin)) { S.ui.merr = 'The PIN must be 4 to 8 numbers.'; return render(); }
    if (m.pin) { d.salt = uid(); d.cred = credOf(d.salt, m.pin); }
    var r = act('user_save', d); if (!r.ok) S.ui.merr = errText(r.error); else S.ui.modal = null; render();
  },
  rules: function () { var s = V().settings; openModal({ type: 'rules' }, { noticeDays: s.noticeDays, approvalDay: s.approvalDay, countFrom: s.countFrom }); },
  rulesSave: function () { var m = S.ui.m, r = act('set', { noticeDays: m.noticeDays, approvalDay: m.approvalDay, countFrom: m.countFrom }); if (!r.ok) S.ui.merr = errText(r.error); else S.ui.modal = null; render(); },
  pinOpen: function () { openModal({ type: 'pin' }, {}); },
  pinSave: function () {
    var m = S.ui.m;
    if (credOf(S.me.salt, m.old || '') !== S.cred) { S.ui.merr = 'The PIN now is not right.'; return render(); }
    if (!pinOk(m.pin)) { S.ui.merr = 'The new PIN must be 4 to 8 numbers.'; return render(); }
    if (m.pin !== m.pin2) { S.ui.merr = 'The two new PINs are not the same.'; return render(); }
    if (!S.online && S.cfg.mode === 'shared') { S.ui.merr = 'No internet. Change the PIN when there is internet.'; return render(); }
    var salt = uid(), r = act('pin', { salt: salt, cred: credOf(salt, m.pin) });
    if (!r.ok) S.ui.merr = errText(r.error); else { S.ui.modal = null; S.notices.push('PIN changed.'); } render();
  },
  invite: function () {
    var link = staffLink(), msg = 'CYP FIN, to ask for money and to approve payments.\n1. Open this link with internet: ' + link + '\n2. Choose your name.\n3. Write the PIN I give you. You can change it in More.';
    openModal({ type: 'text', title: 'Invite the staff', html: '<div class="s m">Send this message. Give each person their own PIN in a separate message.</div><textarea class="in" id="inv-text" rows="7" readonly>' + esc(msg) + '</textarea><div class="btns"><button type="button" class="btn pri" data-a="copyInvite">Copy</button><a class="btn" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">WhatsApp</a></div>' });
  },
  copyInvite: function () { var t = document.getElementById('inv-text'); if (!t) return; t.select(); try { navigator.clipboard.writeText(t.value).catch(function () { document.execCommand('copy'); }); } catch (e) { try { document.execCommand('copy'); } catch (x) {} } S.notices.push('Copied.'); render(); },
  installHelp: function () {
    var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua), steps = ios ? 'In Safari: tap Share, then "Add to Home Screen".' : /Android/.test(ua) ? 'In Chrome: tap the three dots, then "Install app" or "Add to Home screen".' : 'In Chrome or Edge: use the install icon in the address bar. In Safari on Mac: File, then "Add to Dock".';
    openModal({ type: 'text', title: 'Put CYP FIN on this phone', html: (S.installEvt ? '<button type="button" class="btn pri" data-a="install">Install CYP FIN</button>' : '') + '<div>' + steps + '</div><div class="s m">Open the app once with internet. After that it also opens without internet, and what you write is sent when internet comes back.</div>' });
  },
  install: function () { if (S.installEvt) { S.installEvt.prompt(); S.installEvt = null; } H.closeModal(); },
  syncNow: function () { sync().then(render); },
  monthMove: function (el) { var m = S.ui.month || today().slice(0, 7), y = Number(m.slice(0, 4)), mo = Number(m.slice(5)) + Number(el.dataset.id); if (mo < 1) { mo = 12; y--; } if (mo > 12) { mo = 1; y++; } S.ui.month = y + '-' + (mo < 10 ? '0' : '') + mo; render(); },
  budget: function () { S.ui.form = {}; go('budget'); },
  budgetOpen: function (el) { S.ui.form.bsec = S.ui.form.bsec === el.dataset.id ? '' : el.dataset.id; render(); },
  exportPage: function () {
    var sheets = exportSheets(); if (!sheets.length) return;
    saveFile('CYP-FIN_' + EXPORTS[S.ui.tab] + '_' + today() + '.xlsx', makeXlsx(sheets));
  }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]'); if (!el) return;
  var inner = ev.target.closest('button,a,input,select,textarea,label');
  if (inner && inner !== el && el.contains(inner) && !inner.dataset.a) return; /* a control inside a card */
  if (inner && inner !== el && inner.dataset.a && el.contains(inner)) el = inner;
  var fn = H[el.dataset.a]; if (fn) fn(el, ev);
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (S.ui.err && (t.dataset.f || t.dataset.m)) { S.ui.err = ''; var eb = document.querySelector('main .box.err'); if (eb) eb.remove(); }
  if (t.dataset.f) {
    S.ui.form[t.dataset.f] = t.value;
    if (t.dataset.f === 'section') { S.ui.form.line = ''; }
    if (t.dataset.r) { render(); return; }
    if (t.dataset.b) refreshBoxes();
  } else if (t.dataset.m) {
    S.ui.m[t.dataset.m] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.r) { if (t.dataset.m === 'section') S.ui.m.line = ''; render(); }
  } else if (t.dataset.sec) {
    var list = S.ui.m.sections || (S.ui.m.sections = []), i = list.indexOf(t.dataset.sec);
    if (t.checked && i < 0) list.push(t.dataset.sec); if (!t.checked && i >= 0) list.splice(i, 1);
  }
});
document.addEventListener('change', function (ev) {
  var t = ev.target; if (!t.dataset || !t.dataset.photo || !t.files || !t.files[0]) return;
  var kind = t.dataset.photo;
  readPhoto(t.files[0]).then(function (p) {
    if (kind === 'form') { S.ui.form.photo = p; render(); }
    else if (kind === 'receipt') { S.ui.m.photo = p; render(); }
    else if (kind === 'quote') { var r = act('quote_add', { id: S.ui.modal.id, photo: p }); if (!r.ok) S.ui.merr = errText(r.error); render(); }
  }).catch(function () { if (S.ui.modal) S.ui.merr = ERR.photo; else S.ui.err = ERR.photo; render(); });
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  var id = ev.target && ev.target.id;
  if (ev.target && ev.target.tagName === 'DIV' && ev.target.dataset.a && H[ev.target.dataset.a]) { H[ev.target.dataset.a](ev.target, ev); return; }
  if (id === 'lg-pin') H.login(); else if (id === 'st-link') H.connect(); else if (id === 'fa-pin2') H.firstAdmin();
});
window.addEventListener('online', function () { sync(); });
window.addEventListener('offline', function () { S.online = false; render(); });
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.installEvt = e; });
document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
setInterval(function () { if (!document.hidden && S.me && S.cfg && S.cfg.mode === 'shared') sync(); }, 45000);

/* ================= start ================= */
(function boot() {
  render();
  var fromLink = parseLink(location.search + location.hash);
  if (fromLink) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  Promise.all([KV.get('cfg'), KV.get('queue'), KV.get('verif'), KV.get('users'), KV.get('localdb'), KV.get('localfiles')]).then(function (a) {
    S.queue = a[1] || []; S.verif = a[2] || {}; S.users = a[3] || []; S.local = a[4] || null; S.files = a[5] || {};
    var cfg = fromLink || a[0];
    if (!cfg) { S.ui.screen = 'start'; return render(); }
    return startWith(cfg);
  });
  if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {} }
})();
</script>
