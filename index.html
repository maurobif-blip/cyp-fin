<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYP FIN</title>
<meta name="theme-color" content="#0B5FA5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  /* phone first: one column, big targets, system font so it opens without internet */
  --blue:#0B5FA5; --logo:#0091D5; --ink:#14213D; --muted:#4A5568; --ground:#F4F6FA; --card:#FFFFFF; --line:#D5DBE6; --edge:#7A869A;
  --em-bg:#FFE9D1; --em-ink:#6B2C00; --em:#B85300; --ok-bg:#DDF2DA; --ok-ink:#14600A; --wait-bg:#E4EBF7; --wait-ink:#1D3F7A;
  --warn-bg:#FFF4C2; --warn-ink:#5C4400; --bad:#8A160C; --off-bg:#ECECEC; --off-ink:#333333; --demo:#EF7D00;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
h1{margin:0;font-size:22px} h2{margin:8px 0 0;font-size:18px}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--ground)}
.demo{background:var(--demo);color:#1A1A1A;font-weight:700;font-size:14px;padding:8px 16px}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.top .who{font-size:14px;font-weight:700;color:var(--muted);text-align:right}
.net{font-size:13px;font-weight:700;padding:6px 16px;background:var(--warn-bg);color:var(--warn-ink)}
.net.bad{background:#FBE3E0;color:var(--bad)}
.net.ok{background:var(--ok-bg);color:var(--ok-ink)}
main{flex:1 1 auto;padding:16px 16px 136px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.tap{cursor:pointer}
.band{background:var(--em-bg);color:var(--em-ink);margin:-14px -14px 0;padding:10px 14px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.b{font-weight:700} .s{font-size:14px} .m{color:var(--muted)} .num{font-variant-numeric:tabular-nums}.row>.num{white-space:nowrap}
.big{font-size:20px;font-weight:700}
.sec{font-size:14px;font-weight:700;color:var(--blue)}
.pill{padding:4px 10px;border-radius:999px;font-size:14px;font-weight:700;background:var(--wait-bg);color:var(--wait-ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.em{background:var(--em-bg);color:var(--em-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.off{background:var(--off-bg);color:var(--off-ink)}
.tag{padding:2px 8px;border-radius:6px;font-size:14px;font-weight:700;background:var(--ink);color:#fff}
.btn{min-height:48px;padding:0 14px;border-radius:8px;border:2px solid var(--edge);background:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.em{background:var(--em);border-color:var(--em);color:#fff}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{min-height:56px;font-size:18px}
.btn.full{width:100%}
.btns{display:flex;gap:8px}.btns>*{flex:1 1 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-weight:700}
.in{width:100%;min-height:48px;padding:0 12px;border:2px solid var(--edge);border-radius:8px;background:#fff}
textarea.in{padding:10px 12px;min-height:80px}
input[type=file].in{padding:10px;border-style:dashed;font-size:14px}
.box{border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box.info{background:var(--wait-bg);border:2px solid var(--blue);color:var(--wait-ink);font-weight:700}
.box.em{background:var(--em-bg);border:2px solid var(--em);color:var(--em-ink)}
.box.warn{background:var(--warn-bg);border:2px solid #8A6A00;color:var(--warn-ink);font-weight:700}
.box.ok{background:var(--ok-bg);border:2px solid var(--ok-ink);color:var(--ok-ink);font-weight:700}
.box.err{background:#fff;border:2px solid #A61B0F;color:var(--bad);font-weight:700}
.box.plain{background:#fff;border:1px solid var(--line)}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar>i{display:block;background:var(--blue)} .bar>i.add{background:#7FA3DC} .bar>i.em{background:var(--demo)}
.bad{color:var(--bad);font-weight:700} .good{color:var(--ok-ink);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;pointer-events:none}
nav>div{pointer-events:auto;width:100%;max-width:560px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 1 0;min-height:62px;padding:4px 2px;border:0;border-top:4px solid #fff;background:#fff;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--blue);border-top-color:var(--blue)}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.modal{position:fixed;inset:0;z-index:10;background:rgba(20,33,61,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--ground);border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:14px}
.list{display:flex;flex-direction:column;gap:10px}
.user{min-height:60px;justify-content:space-between;text-align:left;width:100%}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks label{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:400}
.checks input{width:22px;height:22px}
img.photo{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.center{align-items:center;text-align:center}
.fabwrap{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:12;display:flex;justify-content:center;pointer-events:none}
.fabwrap.low{bottom:calc(14px + env(safe-area-inset-bottom))}
.fabwrap.top{bottom:auto;top:8px}
.fabwrap>div{width:100%;max-width:560px;display:flex;justify-content:flex-end;padding:0 12px}
.fab{pointer-events:auto;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(20,33,61,.35)}
.pickbar{position:fixed;left:0;right:0;top:0;z-index:13;display:flex;justify-content:center;pointer-events:none}
.pickbar>div{pointer-events:auto;width:100%;max-width:560px;background:var(--ink);color:#fff;font-weight:700;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.pickbar .btn{min-height:40px;color:var(--ink)}
.picking main,.picking nav,.picking .sheet,.picking .top{cursor:crosshair}
.plan{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.plan caption{text-align:left;font-weight:700;padding-bottom:4px}
.plan th,.plan td{padding:7px 0 7px 8px;text-align:right;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.plan th:first-child,.plan td:first-child{text-align:left;padding-left:0;overflow-wrap:anywhere}
.plan thead th{font-size:12px;color:var(--muted);border-top:0;white-space:nowrap}
.plan tbody th{font-weight:400}
.plan .sech th{font-weight:700;color:var(--blue);padding-top:12px}
.plan tfoot th,.plan tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.plan .short{color:var(--bad);font-weight:700}
#plan-secs tbody td{vertical-align:middle}
.top button.who{background:none;border:0;padding:8px 0 8px 8px;min-height:44px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);text-decoration:underline;cursor:pointer}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mgrid .btn{min-height:44px;padding:0;font-size:14px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:6px 0}
.prow>div:first-child{overflow-wrap:anywhere;min-width:0}
.prow .btn{min-height:40px;flex:0 0 auto}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;min-height:44px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.srow .n{font-weight:700;color:var(--blue);text-decoration:underline}
.srow.sbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.viewer{position:fixed;inset:0;z-index:40;background:#111;display:flex;flex-direction:column}
.viewer .vbar{display:flex;gap:8px;padding:10px;background:var(--ground)}
.viewer .vbar .btn{flex:1}
.viewer .vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.viewer img{display:block;max-width:none;height:auto}
.mrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 0}
.mrow .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.mrow .in{flex:0 0 104px;width:104px;text-align:right}
.mrow .btn{flex:0 0 auto;min-height:44px;min-width:56px;padding:0 8px}
.mrow.off .nm,.mrow.off .in{opacity:.45}
.lnk{background:none;border:0;padding:6px 0;min-height:40px;color:var(--blue);font:inherit;font-weight:700;text-align:left;text-decoration:underline;cursor:pointer}
.ask{color:var(--em-ink);font-weight:700;overflow-wrap:anywhere}
.quote{border-left:4px solid var(--edge);padding:2px 0 2px 10px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.cmt{overflow-wrap:anywhere;white-space:pre-wrap}
@media (min-width:700px){body{background:#E7EBF3}#app{box-shadow:0 0 0 1px var(--line)}.modal{align-items:center}.sheet{border-radius:16px}}
@media (prefers-reduced-motion:no-preference){.btn,nav button{transition:background .12s,color .12s}}
</style>
</head>
